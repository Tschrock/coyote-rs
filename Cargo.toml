[package]
name = "coyote-connect"
version = "0.1.0"
edition = "2024"

[dependencies]
btleplug = { version = "0.11", features = ["serde"] }
log = "0.4.22"
rand = "0.8.5"
tokio = { version = "1", features = ["full"] }
uuid = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
