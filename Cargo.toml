[workspace]
resolver = "3"
members = ["ble", "cli", "core", "socket", "waveform"]

[workspace.dependencies]
coyote-connect-ble = { path = "./ble" }
coyote-connect-waveform = { path = "./waveform" }
coyote-connect-core = { path = "./core" }
btleplug = { version = "0.11", features = ["serde"] }
log = "0.4.29"
rand = "0.9.2"
tokio = { version = "1", features = ["full"] }
uuid = "1.20.0"
serde = { version = "1.0", features = ["derive"] }
deku = "0.20"
futures-util = "0.3.31"
tokio-util = "0.7.18"
thiserror = "2.0.18"
num-traits = "0.2"
env_logger = "0.11.8"
