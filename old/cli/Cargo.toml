[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.18", features = ["derive"] }
btleplug = { version = "0.11", features = ["serde"] }
env_logger = "0.11.5"
log = "0.4.22"
rand = "0.8.5"
tokio = { version = "1", features = ["full"] }
uuid = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
arbitrary-int = { version = "1.2.7", features = ["serde"] }
deku = "0.18"
futures-util = "0.3.30"
tokio-util = "0.7.12"
thiserror = "1.0.64"
coyotee = { path = "../coyotee" }
